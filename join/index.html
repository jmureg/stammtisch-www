<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Stammtisch</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="apple-touch-icon" href="../logo.png">
    <link rel="shortcut icon" type="image/png" href="../logo.png">
    <meta name="description" content="Join a Stammtisch group from your invitation link.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stammtisch">
    <meta property="og:title" content="Join Stammtisch">
    <meta property="og:description" content="Join a Stammtisch group from your invitation link.">
    <meta property="og:image" content="https://stammtisch.pro/logo.png">
    <meta property="og:url" content="https://stammtisch.pro/join/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Join Stammtisch">
    <meta name="twitter:description" content="Join a Stammtisch group from your invitation link.">
    <meta name="twitter:image" content="https://stammtisch.pro/logo.png">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LELECKYNXW"></script>
    <script src="../i18n.js"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LELECKYNXW');
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 2em; margin-bottom: 0.5em; }
        p { font-size: 1.1em; margin-bottom: 2em; }
        .button {
            display: inline-block;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <h1>Opening Stammtisch App...</h1>
            <p>Redirecting you now.</p>
        </div>
        <div id="fallback" style="display: none;">
            <h1>Download Stammtisch</h1>
            <p>To join this group, please download the Stammtisch app.</p>
            <a href="https://apps.apple.com/us/app/stammtisch/id6759274599" class="button">App Store</a>
            <a href="/" class="button">Learn More</a>
        </div>
    </div>
    <script>
        const token = window.location.pathname.split('/').pop();
        const appUrl = `stammtisch://join/${token}`;
        
        // Try app deep link
        window.location.href = appUrl;
        
        // Show fallback after 2 seconds
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('fallback').style.display = 'block';
        }, 2000);
    </script>
</body>
</html>
