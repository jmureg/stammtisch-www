<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Stammtisch</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 2em; margin-bottom: 0.5em; }
        p { font-size: 1.1em; margin-bottom: 2em; }
        .button {
            display: inline-block;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Stammtisch</h1>
        <p>Open this link in Safari on your iPhone to join the group in the Stammtisch app.</p>
        <p style="font-size: 0.9em; opacity: 0.9;">If you have the app installed, it should open automatically.</p>
        <a href="https://apps.apple.com/app/stammtisch" class="button">Download App</a>
        <a href="/" class="button">Learn More</a>
    </div>
    <script>
        const path = window.location.pathname;
        
        // Universal Links work automatically on iOS
        // No JavaScript redirect needed - iOS handles it
        if (!path.startsWith('/join/')) {
            // Not a join link, redirect to home
            window.location.href = '/';
        }
    </script>
</body>
</html>
