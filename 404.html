<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Stammtisch</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-99KSB3L8F5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-99KSB3L8F5');
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 2.5em; margin-bottom: 0.3em; }
        p { font-size: 1.1em; margin-bottom: 1.5em; opacity: 0.95; }
        .primary-button {
            display: inline-block;
            padding: 20px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.3em;
            margin: 20px 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .primary-button:active {
            transform: scale(0.95);
        }
        .secondary-button {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1em;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍻 Join Stammtisch</h1>
        <p>You've been invited to join a group!</p>
        <a href="#" id="openApp" class="primary-button">Open in App</a>
        <p style="font-size: 0.9em; opacity: 0.8; margin-top: 30px;">Don't have the app yet?</p>
        <a href="https://apps.apple.com/app/stammtisch" class="secondary-button">Download from App Store</a>
    </div>
    <script>
        const path = window.location.pathname;
        
        if (path.startsWith('/join/')) {
            const token = path.split('/join/')[1];
            
            // When user clicks "Open in App", try to open with custom scheme
            document.getElementById('openApp').addEventListener('click', function(e) {
                e.preventDefault();
                
                // Try custom URL scheme first
                window.location.href = `stammtisch://join/${token}`;
                
                // Fallback: show instructions after 1 second if app didn't open
                setTimeout(() => {
                    alert('If the app didn\'t open, please tap and hold this link, then select "Open in Stammtisch"');
                }, 1000);
            });
        } else {
            window.location.href = '/';
        }
    </script>
</body>
</html>
